<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vending Refill Planner</title>
  <style>
    :root {
      --bg: #f4f4f0;
      --card: #fff;
      --tx: #1c1c1a;
      --mu: #6b6b66;
      --bd: #d8d8d0;
      --ac: #d9480f;
      --on: #fff;
      color-scheme: light dark;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #161615;
        --card: #222220;
        --tx: #eeeee8;
        --mu: #a0a09a;
        --bd: #3a3a36;
        --ac: #ff7a3d;
        --on: #161615
      }
    }

    :root[data-theme="dark"] {
      --bg: #161615;
      --card: #222220;
      --tx: #eeeee8;
      --mu: #a0a09a;
      --bd: #3a3a36;
      --ac: #ff7a3d;
      --on: #161615
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px
    }

    h1 {
      font-size: 20px;
      margin: 14px 12px 4px
    }

    h2 {
      font-size: 17px;
      margin: 0 0 10px
    }

    h3 {
      margin: 0 0 8px
    }

    small,
    .mu {
      color: var(--mu);
      font-weight: 400
    }

    nav {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      flex-wrap: wrap
    }

    button {
      font: inherit;
      border: 1px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer
    }

    button.on,
    button.pri {
      background: var(--ac);
      color: var(--on);
      border-color: var(--ac)
    }

    button.sec {
      background: transparent
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px
    }

    label {
      display: block;
      margin: 8px 0;
      font-weight: 600;
      font-size: 13px
    }

    input,
    select {
      display: block;
      font: inherit;
      width: 100%;
      max-width: 340px;
      padding: 7px 9px;
      border: 1px solid var(--bd);
      border-radius: 8px;
      background: var(--bg);
      color: var(--tx);
      margin-top: 3px
    }

    table {
      border-collapse: collapse
    }

    td,
    th {
      padding: 4px 12px 4px 0;
      text-align: left;
      font-size: 13px
    }

    td input {
      width: 90px
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: end;
      margin-top: 10px
    }

    .row label {
      margin: 0
    }

    .tray-setup {
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 12px;
      margin: 12px 0
    }

    .tray-setup h3 {
      margin: 0 0 8px
    }

    .slot-cap-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px
    }

    .slot-cap-list label {
      margin: 0;
      font-weight: 500
    }

    .slot-cap-list input {
      max-width: none;
      width: 100%
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 6px 0
    }

    .chip {
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 13px
    }

    .chip i {
      font-style: normal;
      margin-left: 6px;
      opacity: .6;
      cursor: pointer
    }

    .pg {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
      margin: 8px 0
    }

    .pc {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px;
      font-size: 12px;
      text-align: center
    }

    .pc.sel {
      outline: 3px solid var(--ac)
    }

    .pc img,
    .pc .ph {
      width: 64px;
      height: 64px
    }

    img {
      object-fit: contain;
      border-radius: 6px;
      background: #fff
    }

    .ph {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e5e5de;
      color: #555;
      font-size: 22px;
      font-weight: 700;
      border-radius: 6px
    }

    .prod {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
      text-align: center
    }

    .prod img,
    .prod .ph {
      width: 72px;
      height: 72px
    }

    .prod label {
      font-weight: 400;
      margin: 0
    }

    .ov {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 20
    }

    .dlg {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow: auto
    }

    .sheet {
      background: #fff;
      color: #111;
      padding: 12px;
      border-radius: 10px
    }

    .mid {
      display: contents
    }

    .pn {
      order: 2
    }

    .q {
      order: 3
    }

    .hd {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px
    }

    .logo {
      height: 44px;
      width: auto
    }

    .sheet h2 {
      margin: 0
    }

    .sheet .mu {
      color: #555
    }

    .tray {
      overflow-x: auto;
      margin: 8px 0 12px
    }

    .tray b {
      display: block;
      font-size: 13px;
      margin-bottom: 3px
    }

    .grid {
      display: grid;
      gap: 4px
    }

    .slot {
      border: 1.5px solid #888;
      border-radius: 6px;
      padding: 4px;
      text-align: center;
      cursor: pointer;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: #1c1c1a;
      background: #fff
    }

    .sn {
      font-weight: 800;
      font-size: 13px;
      background: #111;
      color: #fff;
      border-radius: 4px;
      padding: 0 8px;
      align-self: stretch
    }

    .slot img,
    .slot .ph {
      width: 56px;
      height: 56px
    }

    .pn {
      font-size: 11px;
      line-height: 1.15;
      font-weight: 600;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical
    }

    .pmrp {
      flex: none;
      font-size: 10px;
      line-height: 1;
      font-weight: 800;
      white-space: nowrap;
      color: #111
    }

    .q {
      font-size: 22px;
      font-weight: 800;
      line-height: 1
    }

    .q small {
      font-size: 10px;
      color: #444
    }

    .empty {
      color: #999;
      font-size: 12px;
      margin-top: 30px
    }

    .tot {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse
    }

    .tot th {
      font-size: 10px;
      padding: 2px 4px;
      text-align: left
    }

    .tot td {
      border-top: 1px solid #ccc;
      font-size: 9px;
      line-height: 1.05;
      color: #111;
      padding: 1px 4px;
      vertical-align: middle
    }

    .tot img,
    .tot .ph {
      width: 17px;
      height: 17px;
      font-size: 9px
    }

    .tot .tot-name {
      overflow-wrap: anywhere
    }

    @media print {
      .tot {
        break-before: page;
        page-break-before: always
      }

      .tot thead {
        display: table-header-group
      }

      .tot tr {
        break-inside: avoid;
        page-break-inside: avoid
      }

      .tot th {
        font-size: 8pt;
        padding: 1mm 1.2mm
      }

      .tot td {
        font-size: 7.5pt;
        line-height: 1;
        padding: .55mm 1.2mm
      }

      .tot img,
      .tot .ph {
        width: 5mm;
        height: 5mm;
        font-size: 6pt
      }
    }

    @media print {

      nav,
      .noprint,
      h1 {
        display: none !important
      }

      body,
      main {
        background: #fff;
        padding: 0;
        max-width: none
      }

      * {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact
      }

      .sheet {
        padding: 0;
        border-radius: 0
      }

      .hd {
        margin-bottom: 2mm;
        gap: 3mm;
        height: var(--hh)
      }

      .logo {
        height: var(--hh)
      }

      .sheet h2 {
        font-size: calc(var(--hh)*.42)
      }

      .hd .mu {
        font-size: calc(var(--hh)*.26)
      }

      .tray {
        overflow: visible;
        display: flex;
        gap: 1mm;
        margin: 0 0 1mm
      }

      .tray b {
        margin: 0;
        width: var(--lw);
        flex: none;
        background: #111;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: var(--fs);
        border-radius: 1mm
      }

      .grid {
        grid-template-columns: repeat(var(--n), var(--cw)) !important;
        gap: 1mm;
        justify-content: start
      }

      .slot {
        height: var(--ch);
        min-height: 0;
        padding: .5mm;
        gap: .3mm;
        overflow: hidden;
        border-width: .3mm;
        justify-content: space-between
      }

      .sn {
        font-size: calc(var(--fs)*1.1);
        line-height: 1.3;
        padding: 0
      }

      .mid {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1mm;
        flex: 1;
        min-height: 0
      }

      .slot img,
      .slot .ph {
        width: var(--im);
        height: var(--im);
        flex: none
      }

      .pn {
        font-size: var(--fs);
        line-height: 1.1
      }

      .pmrp {
        font-size: var(--fs);
        line-height: 1;
        font-weight: 800
      }

      .q {
        font-size: var(--qf)
      }

      .q small {
        font-size: var(--fs)
      }

      .empty {
        margin: auto
      }

      .tot {
        break-before: page
      }
    }

    .prod-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin: 8px 0
    }

    .prod-tools input,
    .prod-tools select {
      max-width: 220px
    }

    .prod .edit-fields {
      width: 100%;
      text-align: left
    }

    .prod .edit-fields input,
    .prod .edit-fields select {
      max-width: none;
      width: 100%;
      font-size: 12px
    }

    .prod .edit-fields label {
      display: block;
      text-align: left
    }

    .import-preview {
      overflow: auto;
      max-height: 280px;
      margin: 10px 0
    }

    .import-preview table {
      min-width: 620px;
      width: 100%
    }

    .import-preview th,
    .import-preview td {
      border-bottom: 1px solid var(--bd);
      padding: 6px;
      text-align: left
    }

    .bad {
      color: #b42318
    }

    .machine-library {
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 10px;
      margin: 8px 0 14px
    }

    .machine-library .row {
      margin-top: 6px
    }

    .machine-library select {
      max-width: 420px
    }

    .machine-library p {
      margin: 7px 0 0
    }
  </style>
</head>

    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
    const COL = ['#fde68a', '#fecaca', '#bfdbfe', '#bbf7d0', '#e9d5ff', '#fed7aa', '#fbcfe8', '#a7f3d0', '#c7d2fe', '#fef08a'];
    const DEFAULT_CATS = ['Chips', 'Chocolates', 'Cans', 'Aerated', 'Non-Aerated', 'Healthy snack', 'Savory snack', 'Popcorn', 'Healthy bars', 'Biscuits', 'Dairy Products', 'Cakes', 'Cup Noodles'];
    const blankMachine = (name = 'Machine 1') => ({name, trays: Array.from({length: 6}, () => ({slots: 8, cap: 10, caps: Array(8).fill(10)})), cats: [...DEFAULT_CATS], prods: [], plan: {}});
    const normalizeMachine = m => {
      m = m || blankMachine();
      if (!Array.isArray(m.trays) || !m.trays.length) m.trays = blankMachine().trays;
      if (!Array.isArray(m.cats)) m.cats = [...DEFAULT_CATS]; else m.cats = m.cats.map(c => c === 'Non-aerated' ? 'Non-Aerated' : c);
      if (!Array.isArray(m.prods)) m.prods = []; m.prods.forEach(p => {if (p.cat === 'Non-aerated') p.cat = 'Non-Aerated'; if (p.mrp == null) p.mrp = ''; if (!p.cat) p.cat = 'Uncategorised';});
      if (!m.plan || typeof m.plan !== 'object') m.plan = {};
      m.trays.forEach(t => {const legacy = Number(t.cap) || 10; if (!Array.isArray(t.caps)) t.caps = Array.from({length: t.slots}, () => legacy); else {while (t.caps.length < t.slots) t.caps.push(legacy); t.caps.length = t.slots;} t.caps = t.caps.map(x => Math.max(1, Math.min(99, parseInt(x) || legacy)));});
      return m;
    };
    // IndexedDB stores the complete machine library and product photos.
    // Existing localStorage data is imported once on first launch after this update.
    let machines = [], activeMachineId = '', S = null, activeRecord = null;
    // One shared product/category master for every machine; plans and layouts stay per-machine.
    let CATS = [...DEFAULT_CATS], PRODS = [];
    let v = 0, ed = null, pend = null, warned = false;
    const DB_NAME = 'VendingRefillPlannerDB', DB_VERSION = 1, DB_STORE = 'appData';
    let db = null, writeQueue = Promise.resolve();

    function openPlannerDB() {
      return new Promise((resolve, reject) => {
        if (!('indexedDB' in window)) { reject(new Error('IndexedDB is not supported by this browser.')); return; }
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = () => {
          const database = request.result;
          if (!database.objectStoreNames.contains(DB_STORE)) database.createObjectStore(DB_STORE);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error || new Error('Could not open IndexedDB.'));
        request.onblocked = () => reject(new Error('Database upgrade is blocked by another open tab. Close other planner tabs and reload.'));

    }
    function dbGet(key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readonly'), req = tx.objectStore(DB_STORE).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    // Full backup/restore uses the same IndexedDB keys as the live application.
    async function exportBackup() {
      if (!db) throw new Error('Planner database is not ready. Reload the page and try again.');
      await persistLibrary();
      await writeQueue;
      const data = {
        vrp_machines: await dbGet('vrp_machines'),
        vrp_active_machine: await dbGet('vrp_active_machine'),
        vrp: await dbGet('vrp'),
        vrp_catalog: await dbGet('vrp_catalog')
      };
      if (!Array.isArray(data.vrp_machines) || !data.vrp_machines.length ||
          !data.vrp || typeof data.vrp !== 'object' ||
          !data.vrp_catalog || typeof data.vrp_catalog !== 'object') {
        throw new Error('No complete planner data was found in IndexedDB. Backup was not downloaded.');
      }
      const backup = {
        app: 'Vending Refill Planner',
        version: 2,
        exportedAt: new Date().toISOString(),
        storage: 'IndexedDB',
        data
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'Vending-Planner-Backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      return 'Backup downloaded successfully.';
    }

    async function restoreBackupFile(file) {
      if (!file) return;
      const backup = JSON.parse(await file.text());
      const data = backup && backup.data;
      if (backup.app !== 'Vending Refill Planner' ||
          !data || !Array.isArray(data.vrp_machines) || !data.vrp_machines.length ||
          !data.vrp || typeof data.vrp !== 'object' ||
          !data.vrp_catalog || typeof data.vrp_catalog !== 'object' ||
          !Array.isArray(data.vrp_catalog.cats) || !Array.isArray(data.vrp_catalog.prods)) {
        throw new Error('Invalid or incomplete backup. The file must contain machine records, active machine data, and the shared product catalog.');
      }
      if (!data.vrp_machines.every(m => m && typeof m.id === 'string' && m.data && typeof m.data === 'object')) {
        throw new Error('The backup contains an invalid machine record. Existing data has not been changed.');
      }
      if (!confirm('Restore this backup? This will replace all planner data currently saved in this browser.')) return;
      if (!db) throw new Error('Planner database is not ready. Reload the page and try again.');

      const ids = data.vrp_machines.map(m => m.id);
      const restoredActiveId = ids.includes(data.vrp_active_machine) ? data.vrp_active_machine : ids[0];
      await new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        const store = tx.objectStore(DB_STORE);
        store.put(data.vrp_machines, 'vrp_machines');
        store.put(restoredActiveId, 'vrp_active_machine');
        store.put(data.vrp, 'vrp');
        store.put(data.vrp_catalog, 'vrp_catalog');
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error || new Error('Restore failed while saving to IndexedDB.'));
        tx.onabort = () => reject(tx.error || new Error('Restore was cancelled by the database.'));
      });
      alert('Backup restored successfully. The planner will now reload.');
      location.reload();
    }

    function dbSaveLibrary() {
      // Queue writes so rapid edits cannot overwrite a newer machine-library snapshot.
      const stripCatalog = data => {
        const copy = {...data};
        delete copy.cats;
        delete copy.prods;
        return copy;
      };
      const snapshot = {
        machines: machines.map(m => ({id: m.id, name: m.name, data: stripCatalog(m.data)})),
        activeMachineId,
        activeMachine: S ? {...S, cats: CATS, prods: PRODS} : S,
        catalog: {cats: CATS, prods: PRODS}

      writeQueue = writeQueue.then(() => new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite'), store = tx.objectStore(DB_STORE);
        store.put(snapshot.machines, 'vrp_machines');
        store.put(snapshot.activeMachineId, 'vrp_active_machine');
        store.put(snapshot.activeMachine, 'vrp');
        store.put(snapshot.catalog, 'vrp_catalog');

        tx.onerror = () => reject(tx.error || new Error('IndexedDB write failed.'));

        if (!warned) {

          alert('Could not save data to IndexedDB: ' + (e.message || e) + '. Export a backup if you have important data.');

      });

    async function initStorage() {

      else if (a == 'newmachine') {createMachine()}
      else if (a == 'savemachine') {persistLibrary(); alert('Machine template saved in this browser.'); render()}
      else if (a == 'deletemachine') {
        if (machines.length <= 1) {alert('At least one machine template must remain.'); return }
        if (!confirm('Delete the saved template for ' + (S.name || 'this machine') + '? This cannot be undone.')) return;
        machines = machines.filter(m => m.id !== activeMachineId);
        const next = machines[0]; activeMachineId = next.id; activeRecord = next; S = normalizeMachine(next.data); S.cats = CATS; S.prods = PRODS; ed = null; persistLibrary(); render();
      }
      else if (a == 'addcat') {const n = $('#cname').value.trim(); if (n && !CATS.some(c => norm(c) === norm(n))) {CATS.push(n); save(); render()} }
      else if (a == 'savecats') {save(); alert('Product categories saved in this browser.')}
      else if (a == 'renamecat') {const old = d.c, n = prompt('Rename category:', old); if (n && n.trim() && n.trim() !== old) {const next = n.trim(); if (CATS.some(c => norm(c) === norm(next) && c !== old)) {alert('That category already exists.'); return } CATS = CATS.map(c => c === old ? next : c); PRODS.forEach(p => {if (p.cat === old) p.cat = next}); save(); render()} }
      else if (a == 'bulkassign') {const ids = [...document.querySelectorAll('.prod-select:checked')].map(x => x.value), cat = $('#bulkcat').value; if (!ids.length) {alert('Select at least one product.'); return } PRODS.forEach(p => {if (ids.includes(p.id)) p.cat = cat}); save(); render()}
      else if (a == 'selectall') {document.querySelectorAll('.prod-select').forEach(x => x.checked = el.checked)}
      else if (a == 'saveproduct') {const id = d.id; const p = PRODS.find(x => x.id === id); if (!p) return; const name = $(`[data-a="editname"][data-id="${id}"]`).value.trim(), mrp = $(`[data-a="editmrp"][data-id="${id}"]`).value, cat = $(`[data-a="editcat"][data-id="${id}"]`).value; if (!name) {alert('Product name cannot be blank.'); return } if (mrp !== '' && (!Number.isFinite(Number(mrp)) || Number(mrp) < 0)) {alert('Enter a valid MRP.'); return } p.name = name; p.mrp = mrp === '' ? '' : Number(mrp); p.cat = cat; save(); render()}
      else if (a == 'delcat') {if (PRODS.some(p => p.cat == d.c)) {alert('Remove or move the products in this category first.'); return } CATS = CATS.filter(c => c != d.c); save(); render()}
      else if (a == 'addprod') {const n = $('#pname').value.trim(); if (!n) {alert('Enter a product name.'); return } PRODS.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), name: n, cat: $('#pcat').value, img: pend, mrp: $('#pmrp').value === '' ? '' : Number($('#pmrp').value)}); pend = null; save(); render()}
      else if (a == 'delprod') {
        PRODS = PRODS.filter(p => p.id != d.id);
        for (const machine of machines) {
          const plan = machine.id === activeMachineId ? S.plan : (machine.data && machine.data.plan) || {};
          for (const k in plan) if (plan[k].pid == d.id) delete plan[k];
        }
        save(); render();
      }
      else if (a == 'edit') {const t = +d.t, s = +d.s, x = S.plan[t + '-' + s]; ed = {t, s, cat: 'All', pid: x ? x.pid : null, qty: x ? Math.min(x.qty, capAt(t, s)) : capAt(t, s)}; modal()}
      else if (a == 'chip') {ed.cat = d.c; modal()}
      else if (a == 'pick') {ed.pid = d.id; const pp = PRODS.find(x => x.id == d.id); if (pp && pp.def) ed.qty = Math.min(pp.def, capAt(ed.t, ed.s)); modal()}
      else if (a == 'imppaste') {const t = $('#paste').value; if (!t.trim()) return; try {showImportPreview(rowsToItems(parseTable(t)))} catch (x) {$('#imsg').textContent = 'Import error: ' + x.message} }
      else if (a == 'confirmimport') {const valid = importDraft.filter(x => !x.errors.length); if (!valid.length) {alert('No valid rows to import.'); return } run(applyItems(valid)); importDraft = []}
      else if (a == 'cancelimport') {importDraft = []; const m = $('#imsg'); if (m) m.textContent = 'Import cancelled.'}
      else if (a == 'close') {ed = null; modal()}
      else if (a == 'clear') {delete S.plan[ed.t + '-' + ed.s]; ed = null; save(); render()}
      else if (a == 'save' || a == 'tray') {
        if (!ed.pid) {alert('Pick a product first.'); return } const q = num($('#qty').value, 0, capAt(ed.t, ed.s));
        if (a == 'save') S.plan[ed.t + '-' + ed.s] = {pid: ed.pid, qty: q}; else for (let s = 0; s < S.trays[ed.t].slots; s++)S.plan[ed.t + '-' + s] = {pid: ed.pid, qty: Math.min(q, capAt(ed.t, s))}; ed = null; save(); render()
      }
      else if (a == 'exportbackup') {exportBackup().then(message => alert(message)).catch(error => alert('Backup failed: ' + (error.message || error)))}
      else if (a == 'print') {try {window.print()} catch (x) {alert('Printing is not available here. Open the page in its own tab.')} }
    });
    document.addEventListener('input', e => {if (e.target.id == 'qty' && ed) ed.qty = +e.target.value || 0});
    document.addEventListener('change', e => {
      const el = e.target, a = el.dataset.a, t = +el.dataset.t; if (!a) return;
      if (a == 'machine-select') {if (el.value !== activeMachineId) activateMachine(el.value)}
      else if (a == 'name') {S.name = el.value; save(); const opt = $('[data-a="machine-select"] option:checked'); if (opt) opt.textContent = el.value || 'Unnamed machine'}
      else if (a == 'paper') {S.paper = el.value; save(); render()}
      else if (a == 'impfile' && el.files[0]) {const f = el.files[0]; if (/\.xlsx?$/i.test(f.name)) {if (!window.XLSX) {$('#imsg').textContent = 'Excel reader unavailable. Save the workbook as CSV and import it.'} else {f.arrayBuffer().then(buf => {const wb = XLSX.read(buf, {type: 'array'}), ws = wb.Sheets[wb.SheetNames[0]], rows = XLSX.utils.sheet_to_json(ws, {header: 1, defval: ''}); showImportPreview(rowsToItems(rows))}).catch(x => $('#imsg').textContent = 'Import error: ' + x.message)} } else {f.text().then(t => {if (/\.json$/i.test(f.name)) {const data = JSON.parse(t); showImportPreview((Array.isArray(data) ? data : []).map(x => ({...x, mrp: x.mrp ?? '', image: x.image || x.img || ''})));} else showImportPreview(rowsToItems(parseTable(t)))}).catch(x => $('#imsg').textContent = 'Import error: ' + x.message)} }
      else if (a == 'backupfile' && el.files[0]) {
        const file = el.files[0];
        restoreBackupFile(file).catch(error => alert('Restore failed: ' + (error.message || error)));
        el.value = '';
      }
      else if (a == 'impimgs' && el.files.length) {$('#imsg').textContent = 'Matching photos…'; run(matchImgs([...el.files]))}
      else if (a == 'selectall') {document.querySelectorAll('.prod-select').forEach(x => x.checked = el.checked)}
      else if (a == 'totals') {S.tot = el.checked; save(); render()}
      else if (a == 'ntrays') {const n = num(el.value, 1, 20), last = S.trays[S.trays.length - 1]; while (S.trays.length < n) S.trays.push({...last, caps: [...last.caps]}); S.trays.length = n; save(); render()}
      else if (a == 'slots') {const tr = S.trays[t], n = num(el.value, 1, 20), fallback = tr.caps?.[tr.caps.length - 1] || tr.cap || 10; while (tr.caps.length < n) tr.caps.push(fallback); tr.caps.length = n; tr.slots = n; save(); render()}
      else if (a == 'slotcap') {S.trays[t].caps[+el.dataset.s] = num(el.value, 1, 99); save()}
      else if (a == 'newimg' && el.files[0]) readImg(el.files[0], d => {pend = d; const p = $('#pprev'); p.src = d; p.style.display = 'block'});
      else if (a == 'chimg' && el.files[0]) {const id = el.dataset.id; readImg(el.files[0], d => {PRODS.find(p => p.id == id).img = d; save(); render()})}
    });
    $('#hl').src = LOGO;
    initStorage().then(() => {
      render();
    }).catch(error => {
      console.error('Vending Refill Planner storage initialization failed:', error);
      $('#main').innerHTML = `<div class="card"><h2>Unable to open planner storage</h2><p>${esc(error.message || error)}</p><p>Please use an up-to-date browser with IndexedDB enabled, then reload this page. Your previous localStorage data has not been intentionally deleted.</p></div>`;
    });
  </script>
</body>
